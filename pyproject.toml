[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGNC"
version = "1.0.0"
description = "A Guidance, Navigation, and Control toolkit for spacecraft."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Batuhan Akkova", email = "batuhanakkova1@gmail.com" },
]
license = "MIT"
keywords = [
    "gnc",
    "astrodynamics",
    "aerospace",
    "spacecraft",
    "orbital-mechanics",
    "attitude-determination",
    "attitude-control",
    "kalman-filter",
    "satellite",
    "space-situational-awareness",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Aerospace",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pymsis>=0.6.0",
    "ppigrf>=0.1.0",
    "pandas>=1.3.0",
    "plotly>=5.0.0",
    "joblib>=1.3.0",
    "numba>=0.56.0",
]

[project.urls]
Homepage = "https://github.com/BatuhanAkkova/OpenGNC"
Documentation = "https://BatuhanAkkova.github.io/OpenGNC/"
Repository = "https://github.com/BatuhanAkkova/OpenGNC.git"
Issues = "https://github.com/BatuhanAkkova/OpenGNC/issues"
Changelog = "https://github.com/BatuhanAkkova/OpenGNC/releases"

[project.optional-dependencies]
sat = [
    "sgp4>=2.21",
]
spk = [
    "jplephem>=2.17",
    "spiceypy>=5.0.0",
]
all = [
    "sgp4>=2.21",
    "jplephem>=2.17",
    "spiceypy>=5.0.0",
    "casadi>=3.6.0",
]
mpc = [
    "casadi>=3.6.0",
]
interop = [
    "jplephem>=2.17",
    "spiceypy>=5.0.0",
]
ops = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
experimental = [
    "gmatpy",
]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opengnc = ["*.csv", "py.typed", "dashboard/static/*", "ops/dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "benchmarks",
    "build",
    "dist",
    "docs",
    "examples",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
