[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenGNC"
version = "1.0.0"
description = "A Guidance, Navigation, and Control toolkit for spacecraft."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Batuhan Akkova" },
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pymsis>=0.6.0",
    "ppigrf>=0.1.0",
    "pandas>=1.3.0",
    "dash>=2.0.0",
    "numba>=0.56.0",
]

[project.optional-dependencies]
sat = [
    "sgp4>=2.21",
]
spk = [
    "jplephem>=2.17",
    "spiceypy>=5.0.0",
]
all = [
    "sgp4>=2.21",
    "jplephem>=2.17",
    "spiceypy>=5.0.0",
    "casadi>=3.6.0",
]
mpc = [
    "casadi>=3.6.0",
]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opengnc = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "benchmarks",
    "build",
    "dist",
    "docs",
    "examples",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
