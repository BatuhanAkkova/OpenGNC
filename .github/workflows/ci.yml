name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev,ops]"

    - name: Smoke import optional runtime deps
      run: |
        python -c "import fastapi, plotly, uvicorn; print('runtime imports OK')"

    - name: Ruff Format Check
      run: python -m ruff format --check src tests

    - name: Ruff Lint
      run: python -m ruff check src

    - name: Mypy Typecheck
      run: python -m mypy src

  test:
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ops]"
        pip install pytest-cov

    - name: Smoke import visualization stack
      run: |
        python -c "import plotly, opengnc.visualization; print('visualization imports OK')"

    - name: Run tests with coverage
      run: pytest --cov=src/opengnc --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  cpp-test:
    name: cpp-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Build C++ Test Runner
      run: cmake --build build --config Release --target test_runner

    - name: Run C++ Unit Tests
      run: ctest --test-dir build -C Release --output-on-failure

  build-package:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tooling
      run: python -m pip install --upgrade pip build twine

    - name: Build sdist and wheel
      run: python -m build

    - name: Check package metadata with Twine
      run: twine check --strict dist/*
