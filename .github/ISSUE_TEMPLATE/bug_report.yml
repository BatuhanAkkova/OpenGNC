name: Bug Report
description: Create a report to help us improve OpenGNC
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant context as possible.
  - type: input
    id: version
    attributes:
      label: OpenGNC Version
      description: What version of OpenGNC are you using? (e.g. 1.0.0, main branch)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python & OS Environment
      description: Python version, operating system, and hardware architecture.
      placeholder: "Python 3.11.5 on Ubuntu 22.04 LTS (x86_64)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Please provide a minimal, self-contained Python script to reproduce the issue.
      render: python
      placeholder: |
        import numpy as np
        import opengnc
        # reproduce issue here
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Relevant Log Output or Traceback
      description: Paste any full error messages or tracebacks here.
      render: shell
